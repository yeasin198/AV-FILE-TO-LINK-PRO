<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>{{file_name}} | MLSWTV Stream</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
    :root {
        --bg-color: #0d0d0d;
        --card-bg: #1c1c1c;
        --text-color: #ffffff;
        --btn-vlc: #e67e22;
        --btn-mx: #2980b9;
        --btn-dl: #27ae60; /* ডাউনলোডের জন্য গাঢ় সবুজ */
        --btn-tg: #3498db;
    }

    body {
        background-color: var(--bg-color);
        color: var(--text-color);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
        margin: 0;
        padding: 10px;
        display: flex;
        justify-content: center;
        min-height: 100vh;
    }

    .container {
        width: 100%;
        max-width: 600px;
        display: flex;
        flex-direction: column;
        gap: 15px;
    }

    h2 {
        font-size: 16px;
        color: #ddd;
        margin: 5px 0;
        text-align: center;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    
    /* ভিডিও প্লেয়ার */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 10px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        overflow: hidden;
        border: 1px solid #333;
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* লোডার */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 45px;
        height: 45px;
        border: 4px solid rgba(255,255,255,0.1);
        border-top: 4px solid var(--btn-mx);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        display: none;
        pointer-events: none;
        z-index: 10;
    }
    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    /* বাটন কন্টেইনার */
    .btn-container {
        display: flex;
        flex-direction: column;
        gap: 10px;
    }

    /* প্লেয়ার বাটনের সারি */
    .player-row {
        display: flex;
        gap: 10px;
    }

    .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 14px;
        border-radius: 8px;
        text-decoration: none;
        color: #fff;
        font-weight: bold;
        font-size: 15px;
        border: none;
        transition: transform 0.2s, box-shadow 0.2s;
        box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
    
    .btn:active { transform: scale(0.97); }
    .btn i { margin-right: 8px; font-style: normal; font-size: 18px; }

    .vlc { background: var(--btn-vlc); flex: 1; }
    .mx { background: var(--btn-mx); flex: 1; }
    
    /* প্রধান ডাউনলোড বাটন */
    .download-btn {
        background: var(--btn-dl);
        width: 100%;
        font-size: 16px;
        padding: 15px;
        box-sizing: border-box;
        border-bottom: 4px solid #1e8449; /* 3D effect */
    }
    
    .tg { background: var(--btn-tg); width: 100%; box-sizing: border-box; margin-top: 5px; }

    /* বিজ্ঞাপন */
    .ad-box { 
        width: 100%;
        background: transparent;
        border-radius: 5px; 
        min-height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
    }
    
    .footer { font-size: 11px; color: #555; margin-top: 15px; text-align: center; }
</style>
</head>
<body>

<div class="container">
    <h2>{{file_name}}</h2>

    <!-- বিজ্ঞাপন ১ -->
    <div class="ad-box">
        <script
  type="text/javascript"
  src="https://pl27086336.effectivegatecpm.com/e1/c7/cb/e1c7cba8047534fa081eed07b4774cb3.js"
></script>
    </div>

    <!-- ভিডিও প্লেয়ার -->
    <div class="video-wrapper">
        <div id="loader"></div>
        <video id="video" controls playsinline poster="{{file_thumb}}"></video>
    </div>

    <!-- বাটন সেকশন -->
    <div class="btn-container">
        <!-- অনলাইন প্লেয়ার (পাশাপাশি) -->
        <div class="player-row">
            <a href="intent:{{file_url}}#Intent;package=org.videolan.vlc;type=video/*;end" class="btn vlc">
                <i>🚀</i> VLC Play
            </a>
        </div>

    <!-- টেলিগ্রাম -->
    <a href="https://t.me/mlswtv" class="btn tg">📢 Join Main Channel</a>

    <!-- বিজ্ঞাপন ২ -->
    <div class="ad-box">
        <script
  async="async"
  data-cfasync="false"
  src="https://pl27716245.effectivegatecpm.com/54ee6745b71d138e7d917e7c9e4871cf/invoke.js"
></script>
<div id="container-54ee6745b71d138e7d917e7c9e4871cf"></div>
    </div>

    <div class="footer">Powered by AV mlswtv</div>
</div>

<!-- পপ-আন্ডার -->
<script
  type="text/javascript"
  src="https://pl27086317.effectivegatecpm.com/58/bf/a6/58bfa61d4e5a88e1fff8b0244e1e12fb.js"
></script>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

<script>
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    showLoader();

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var hls = new Hls({
            autoStartLoad: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, hideLoader);
    } else {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', hideLoader);
    }
</script>

</body>
</html>
