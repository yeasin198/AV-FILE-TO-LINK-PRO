<!DOCTYPE html>

<head>
<meta charset="UTF-8" />
<title>{{file_name}} | Fast Stream</title>

<style>
    body {
        background-color: #0d0d0d;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        margin: 0;
        padding: 10px;
        text-align: center;
    }
    .container { max-width: 600px; margin: auto; position: relative; }
    h2 { font-size: 16px; margin: 10px 0; color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* ভিডিও প্লেয়ার */
    .video-wrapper {
        position: relative;
        width: 100%;
        aspect-ratio: 16/9;
        background: #000;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.7);
        overflow: hidden;
    }
    
    video { width: 100%; height: 100%; object-fit: contain; }

    /* লোডার */
    #loader {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        border: 4px solid #333;
        border-top: 4px solid #2196f3;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
        display: none;
        pointer-events: none;
        z-index: 10;
    }

    @keyframes spin { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }
    
    /* বাটন */
    .btn-container { display: flex; gap: 10px; margin-top: 15px; }
    .btn { flex: 1; padding: 12px; border-radius: 5px; text-decoration: none; color: #fff; font-weight: bold; font-size: 14px; border: none; transition: 0.2s; background: #333; }
    .btn:active { transform: scale(0.98); }
    .vlc { background: #ff5722; }
    .mx { background: #2196f3; }
    .tg { background: #0088cc; display: block; margin-top: 10px; width: 100%; box-sizing: border-box; }
    
    /* বিজ্ঞাপনের জায়গা */
    .ad-box { 
        margin: 15px 0; 
        padding: 0; 
        background: transparent; /* ব্যাকগ্রাউন্ড কালো না রেখে ট্রান্সপারেন্ট রাখা ভালো */
        border-radius: 5px; 
        min-height: 50px; 
        display: flex; 
        justify-content: center; 
        align-items: center;
        overflow: hidden;
    }
    
    .footer { font-size: 10px; color: #444; margin-top: 20px; }
</style>
</head>
<body>

<div class="container">

</div>

<!-- পপ-আন্ডার বিজ্ঞাপন (সবার শেষে) -->
<script
  type="text/javascript"
  src="https://pl28277221.effectivegatecpm.com/3b/9d/63/3b9d63c666674e0f9bee1246f40b5f81.js"
></script>

<!-- HLS Script -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.4.0/dist/hls.min.js"></script>

<script>
    // --- ভিডিও প্লেয়ার কনফিগারেশন ---
    var video = document.getElementById('video');
    var videoSrc = "{{file_url}}";
    var loader = document.getElementById('loader');

    function showLoader() { loader.style.display = 'block'; }
    function hideLoader() { loader.style.display = 'none'; }

    video.addEventListener('waiting', showLoader);
    video.addEventListener('playing', hideLoader);
    video.addEventListener('canplay', hideLoader);
    showLoader();

    if (Hls.isSupported() && videoSrc.includes('.m3u8')) {
        var hls = new Hls({
            autoStartLoad: true,
            maxBufferLength: 30,
            maxMaxBufferLength: 60,
            manifestLoadingTimeOut: 5000,
        });
        hls.loadSource(videoSrc);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, hideLoader);
    } else {
        video.src = videoSrc;
        video.addEventListener('loadedmetadata', hideLoader);
    }
    
    // বিজ্ঞাপন লোডিং এর স্ক্রিপ্ট এখান থেকে মুছে ফেলা হয়েছে কারণ আমরা HTML এ সরাসরি দিয়েছি।
</script>
